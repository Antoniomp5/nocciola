<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Nocciola</ion-title>
  </ion-toolbar>
  <ion-button color="secondary">...</ion-button>
  <ion-button color="danger">...</ion-button>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Lista de helados</ion-title>
      <!-- En tu home.page.html -->
      <ion-item class="card-sombreada">...</ion-item>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <h2>Nuestros helados</h2>
      </ion-col>
    </ion-row>



    <!-- Recorremos la lista definida en el TS -->
    <ion-row *ngFor="let tarea of listaDeTareas">

      <ion-col size="12" size-md="4">
        <img src="https://placehold.co/400x250/8d6e63/ffffff?text=Helado" [alt]="tarea.titulo" class="imagen-helado"
          width="200" />
      </ion-col>

      <ion-col size="12" size-md="8">
        <!-- Mostramos el título de cada tarea -->
        <h3>{{ tarea.titulo }}</h3>

        <!-- Mostramos el estado según disponible -->
        <p *ngIf="tarea.disponible; else noDisponible">
          Disponible
        </p>

        <ng-template #noDisponible>
          <p>No disponible</p>
        </ng-template>

        <ion-button>
          Contactar
        </ion-button>


      </ion-col>

    </ion-row>
  </ion-grid>

</ion-content>

<ion-footer>
  <div class="container">
    <span class="text-muted">&copy; 2026
      Antonio Hernández Gilabert - DAH - 2º DAW - Curso 26/27
    </span>
    <ion-toolbar>
      <ion-title size="large">Lista de helados</ion-title>
      <!-- En tu home.page.html -->
      <ion-item class="card-sombreada">...</ion-item>
    </ion-toolbar>
  </div>


</ion-footer>
