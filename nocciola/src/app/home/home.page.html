<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Nocciola</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="alternarTema()"
        [attr.aria-label]="modoOscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'">
        <ion-icon slot="icon-only" [name]="modoOscuro ? 'moon-outline' : 'sunny-outline'"></ion-icon>
      </ion-button>
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <main class="home-container">
    <h1>Nuestros helados</h1>

    <ion-grid class="helados-grid">
      <ion-row>
        <ion-col *ngFor="let helado of listaDeHelados" size="12" size-md="6" size-xl="4">
          <article class="helado-card">
            <img
              src="https://chefeel.com/chefgeneralfiles/2022/05/hela-1-880x762.jpg"
              [alt]="helado.titulo"
              class="imagen-helado"
            />
            <div class="helado-card-content">
              <h2>{{ helado.titulo }}</h2>
              <p [class.disponible]="helado.disponible" [class.no-disponible]="!helado.disponible">
                {{ helado.disponible ? 'Disponible' : 'No disponible' }}
              </p>
              <div class="helado-card-actions">
                <ion-button expand="block">Contactar</ion-button>
                <ion-button expand="block" fill="outline">Información</ion-button>
              </div>
            </div>
          </article>
        </ion-col>
      </ion-row>
    </ion-grid>

    <section class="nuevo-helado">
      <h2>Añadir un helado</h2>
      <ion-item>
        <ion-input
          label="Nombre del helado"
          label-placement="floating"
          placeholder="Ej. Helado de vainilla"
          [(ngModel)]="nuevoHelado.titulo"
        ></ion-input>
      </ion-item>
      <ion-button expand="block" (click)="agregarHelado()" class="ion-margin-top">
        Añadir helado
      </ion-button>
    </section>
  </main>
</ion-content>

<ion-footer [translucent]="false">
  <div class="footer-content">
    <span>
      &copy; 2026
      Antonio Hernández Gilabert - DAH - 2º DAW - Curso 26/27
    </span>
  </div>
</ion-footer>
